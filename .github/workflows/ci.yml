name: ci

# Page contract, modules, packs, notices, links, and leak checks.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check shipped modules
        run: find site scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Check generated CSP
        run: node scripts/update-csp.mjs --check
      - name: node --test
        run: node --test "tests/*.test.mjs"
