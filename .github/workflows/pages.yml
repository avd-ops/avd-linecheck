name: pages

# Publishes the spike pages to GitHub Pages (the real page replaces them at v0).
# The 8 MiB test file is random bytes made here, never committed.
on:
  push:
    branches: [main]
    paths: ['spikes/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Make the S4 test file
        run: head -c 8388608 /dev/urandom > spikes/s4/8m.bin && sha256sum spikes/s4/8m.bin
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: spikes
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # What visitors get must be what we built: a proxy or CDN in front of Pages can inject scripts or
  # reporting endpoints that break "nothing leaves the browser" (spec L5, L7).
  served:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Served pages match the repo
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
        run: |
          SITE="${SITE%/}"
          sleep 30
          fail=0
          for page in index.html s1/index.html s3/index.html s4/index.html; do
            path="${page%index.html}"
            echo "Checking $SITE/$path"
            curl -sSL --max-time 30 -D headers.txt -o served.html "$SITE/$path"
            if ! cmp -s served.html "spikes/$page"; then echo "::error::$SITE/$path differs from spikes/$page (something in front of Pages changed it)"; diff <(cat "spikes/$page") served.html | head -20; fail=1; fi
            if grep -qiE '^(report-to|nel|cf-ray):' headers.txt; then echo "::error::$SITE/$path is served through a proxy that adds its own reporting (switch the DNS record to DNS only)"; grep -iE '^(server|report-to|nel|cf-ray):' headers.txt; fail=1; fi
          done
          exit $fail
