name: pages

# Publishes the spike pages to GitHub Pages (the real page replaces them at v0).
# The 8 MiB test file is random bytes made here, never committed.
on:
  push:
    branches: [main]
    paths: ['spikes/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Make the S4 test file
        run: head -c 8388608 /dev/urandom > spikes/s4/8m.bin && sha256sum spikes/s4/8m.bin
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: spikes
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
